# N E Baterias · manutenção do Supabase (plano Free)
#  1) A cada 3 dias chama a função ping() → evita a pausa por 7 dias sem uso.
#  2) Todo domingo faz backup completo (pg_dump) e guarda como artefato por 90 dias.
#
# Segredos no GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<ref-do-projeto>.supabase.co
#   SUPABASE_ANON_KEY  chave "anon" (pública)
#   SUPABASE_DB_URL    string de conexão do Postgres (Project Settings → Database → Connection string → URI,
#                      modo "Session pooler"), com a senha do banco
name: manutencao-supabase

on:
  schedule:
    - cron: "17 11 */3 * *"   # 08:17 em Fortaleza, a cada 3 dias
    - cron: "37 9 * * 0"      # 06:37 em Fortaleza, todo domingo
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar ping()
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'

  backup:
    if: github.event.schedule == '37 9 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente Postgres 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: pg_dump (schema public)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          arq="backup-nebaterias-$(date +%Y-%m-%d).sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges | gzip > "$arq"
          echo "ARQ=$arq" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQ }}
          path: ${{ env.ARQ }}
          retention-days: 90
