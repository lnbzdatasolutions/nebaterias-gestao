<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações · notebook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E40AF}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #12161C; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; background: #12161C; color: #FFFFFF; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #FFC21A; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12161C" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><rect x="2" y="7" width="20" height="13" rx="2"></rect><path d="M6 7V4h3v3M15 7V4h3v3M6 13.5h4M14 13.5h4M16 11.5v4"></path></svg>
      </div>
      <span style="font-family: Barlow, sans-serif; font-weight: 700; font-size: 20px">N E Baterias</span>
    </div>
    <nav aria-label="Menu" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="9">
        <a href="{{m.href}}" aria-current="{{m.atual}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: {{m.cor}}; background: {{m.fundo}}; font-size: 15px; font-weight: {{m.peso}}">{{m.nome}}</a>
      </sc-for>
    </nav>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 18px">
    <header>
      <h1 style="margin: 0; font-family: Barlow, sans-serif; font-weight: 700; font-size: 32px">Configurações</h1>
      <div style="font-size: 14px; color: #5B6472">Conectada como esposa@nebaterias.com.br</div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; max-width: 1000px">
      <section aria-label="Alterar senha" style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E4E9; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0 0 4px; font-family: Barlow, sans-serif; font-weight: 700; font-size: 20px">Alterar senha</h2>
        <label for="s1" style="font-size: 13px; font-weight: 600">Senha atual</label>
        <input id="s1" type="password" autocomplete="current-password" style="height: 46px; box-sizing: border-box; border-radius: 10px; border: 1px solid #C9CED6; padding: 0 12px; font-size: 15px">
        <label for="s2" style="font-size: 13px; font-weight: 600">Nova senha (mínimo 8 caracteres)</label>
        <input id="s2" type="password" autocomplete="new-password" style="height: 46px; box-sizing: border-box; border-radius: 10px; border: 1px solid #C9CED6; padding: 0 12px; font-size: 15px">
        <label for="s3" style="font-size: 13px; font-weight: 600">Repita a nova senha</label>
        <input id="s3" type="password" autocomplete="new-password" style="height: 46px; box-sizing: border-box; border-radius: 10px; border: 1px solid #C9CED6; padding: 0 12px; font-size: 15px">
        <button style="margin-top: 6px; min-height: 48px; border-radius: 12px; border: none; background: #12161C; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Salvar nova senha</button>
      </section>

      <section aria-label="Exportar dados" style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E4E9; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0 0 4px; font-family: Barlow, sans-serif; font-weight: 700; font-size: 20px">Exportar dados</h2>
        <p style="margin: 0; font-size: 14px; color: #5B6472">Baixa uma planilha (CSV) que abre no Excel ou no Google Planilhas. Bom para guardar uma cópia todo mês.</p>
        <label for="per" style="font-size: 13px; font-weight: 600">Período</label>
        <select id="per" style="height: 46px; border-radius: 10px; border: 1px solid #C9CED6; padding: 0 10px; font-size: 15px; font-family: Inter, sans-serif; background: #FFFFFF"><option>Outubro de 2026</option><option>Este ano</option><option>Tudo</option></select>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
          <button style="min-height: 46px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Vendas</button>
          <button style="min-height: 46px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Compras</button>
          <button style="min-height: 46px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Estoque</button>
          <button style="min-height: 46px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Clientes</button>
        </div>
      </section>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; max-width: 1000px; padding: 16px 20px; background: #FFFFFF; border: 1px solid #E1E4E9; border-radius: 16px">
      <div style="font-size: 14px; color: #5B6472">N E Baterias · Av. Alberto Magno, 754 · (85) 98710-5240 · @nebaterias</div>
      <a href="DesktopLogin.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #F1B5AF; color: #B42318; text-decoration: none; font-size: 15px; font-weight: 600">Sair</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const menuItens = [
      ['Início', 'DesktopInicio.dc.html'], ['Vender', 'DesktopVender.dc.html'], ['Estoque', 'DesktopEstoque.dc.html'],
      ['Entrada', 'DesktopEntrada.dc.html'], ['Painel', 'DesktopPainel.dc.html'], ['Vendas', 'DesktopVendas.dc.html'],
      ['Clientes', 'DesktopClientes.dc.html'], ['Produtos', 'DesktopProdutos.dc.html'], ['Configurações', 'DesktopConfiguracoes.dc.html']
    ];
    return {
      menu: menuItens.map(([nome, href]) => {
        const on = nome === 'Configurações';
        return { nome, href, atual: on ? 'page' : 'false', cor: on ? '#12161C' : '#C9CED6', fundo: on ? '#FFC21A' : 'transparent', peso: on ? 700 : 500 };
      })
    };
  }
}
</script>
</body>
</html>
