<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Produtos · notebook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E40AF}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #12161C; display: flex; flex-wrap: wrap; align-items: stretch; position: relative">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; background: #12161C; color: #FFFFFF; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #FFC21A; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12161C" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><rect x="2" y="7" width="20" height="13" rx="2"></rect><path d="M6 7V4h3v3M15 7V4h3v3M6 13.5h4M14 13.5h4M16 11.5v4"></path></svg>
      </div>
      <span style="font-family: Barlow, sans-serif; font-weight: 700; font-size: 20px">N E Baterias</span>
    </div>
    <nav aria-label="Menu" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="9">
        <a href="{{m.href}}" aria-current="{{m.atual}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: {{m.cor}}; background: {{m.fundo}}; font-size: 15px; font-weight: {{m.peso}}">{{m.nome}}</a>
      </sc-for>
    </nav>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 18px">

    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div>
        <h1 style="margin: 0; font-family: Barlow, sans-serif; font-weight: 700; font-size: 32px">Produtos</h1>
        <div style="font-size: 14px; color: #5B6472">Cadastro e preço de venda · estoque e custo mudam pela Entrada e pelas vendas</div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <button style="height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Salvar preços alterados</button>
        <button onClick="{{abrir}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: none; background: #FFC21A; color: #12161C; font-family: Inter, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">+ Nova bateria</button>
      </div>
    </header>

    <section aria-label="Filtros" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <div style="position: relative; flex: 1 1 300px; max-width: 420px">
        <label for="q" style="position: absolute; left: -9999px">Buscar produto</label>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6472" style="position: absolute; left: 12px; top: 13px; stroke-width: 2; stroke-linecap: round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Modelo ou carro" style="width: 100%; box-sizing: border-box; height: 46px; border-radius: 12px; border: 1px solid #C9CED6; padding: 0 12px 0 40px; font-size: 15px; font-family: Inter, sans-serif">
      </div>
      <div role="group" aria-label="Filtrar por marca" style="display: flex; gap: 6px">
        <sc-for list="{{marcas}}" as="m" hint-placeholder-count="4">
          <button aria-pressed="{{m.ativo}}" onClick="{{m.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: {{m.borda}}; background: {{m.fundo}}; color: {{m.cor}}; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{m.nome}}</button>
        </sc-for>
      </div>
    </section>

    <section aria-label="Tabela de produtos" style="background: #FFFFFF; border: 1px solid #E1E4E9; border-radius: 16px; overflow-x: auto">
      <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px">
        <thead>
          <tr style="text-align: left; color: #5B6472; font-size: 12px; background: #FAFBFC">
            <th style="padding: 12px 10px; font-weight: 600">Modelo</th>
            <th style="padding: 12px 10px; font-weight: 600">Marca · linha</th>
            <th style="padding: 12px 10px; font-weight: 600">Carros que atende</th>
            <th style="padding: 12px 10px; font-weight: 600">Preço de venda</th>
            <th style="padding: 12px 10px; font-weight: 600">Sem a usada</th>
            <th style="padding: 12px 10px; font-weight: 600; text-align: center">Mínimo</th>
            <th style="padding: 12px 10px; font-weight: 600; text-align: center">Garantia</th>
            <th style="padding: 12px 10px; font-weight: 600; text-align: center">Ativo</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{produtos}}" as="p" hint-placeholder-count="7">
            <tr style="border-top: 1px solid #EEF0F3">
              <td style="padding: 10px; font-family: Barlow, sans-serif; font-weight: 700; font-size: 17px">{{p.modelo}}</td>
              <td style="padding: 10px; color: #5B6472">{{p.marca}} · {{p.linha}}</td>
              <td style="padding: 10px; color: #3D4652; max-width: 240px">{{p.aplicacoes}}</td>
              <td style="padding: 8px 10px"><input aria-label="{{p.rotuloPreco}}" value="{{p.preco}}" style="width: 120px; height: 40px; box-sizing: border-box; border-radius: 10px; border: 1px solid #C9CED6; padding: 0 10px; font-size: 15px; font-weight: 600; font-family: Inter, sans-serif"></td>
              <td style="padding: 8px 10px"><input aria-label="{{p.rotuloSem}}" value="{{p.semSucata}}" style="width: 120px; height: 40px; box-sizing: border-box; border-radius: 10px; border: 1px solid #C9CED6; padding: 0 10px; font-size: 15px; font-family: Inter, sans-serif"></td>
              <td style="padding: 10px; text-align: center">{{p.minimo}}</td>
              <td style="padding: 10px; text-align: center">{{p.garantia}}</td>
              <td style="padding: 10px; text-align: center"><input type="checkbox" checked="" aria-label="{{p.rotuloAtivo}}" style="width: 20px; height: 20px; accent-color: #12161C"></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
  </main>

  <sc-if value="{{aberta}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(18, 22, 28, 0.55); display: flex; justify-content: center; align-items: flex-start; padding: 56px 16px; box-sizing: border-box">
      <div role="dialog" aria-label="Nova bateria" style="width: 100%; max-width: 460px; border-radius: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3)">
        <dc-import name="ProdutoRapido" on-fechar="{{fechar}}" hint-size="100%,860px"></dc-import>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { aberta: false, marca: 'Todas' };
  }
  renderVals() {
    const menuItens = [
      ['Início', 'DesktopInicio.dc.html'], ['Vender', 'DesktopVender.dc.html'], ['Estoque', 'DesktopEstoque.dc.html'],
      ['Entrada', 'DesktopEntrada.dc.html'], ['Painel', 'DesktopPainel.dc.html'], ['Vendas', 'DesktopVendas.dc.html'],
      ['Clientes', 'DesktopClientes.dc.html'], ['Produtos', 'DesktopProdutos.dc.html'], ['Configurações', 'DesktopConfiguracoes.dc.html']
    ];
    const todos = [
      { modelo: 'M60GD', marca: 'Moura', linha: 'Automotiva', aplicacoes: 'Onix, HB20, Argo, Corolla, Civic', preco: 'R$ 450,00', semSucata: 'R$ 490,00', minimo: '1', garantia: '12 m' },
      { modelo: 'M60GE', marca: 'Moura', linha: 'Automotiva', aplicacoes: 'Onix, HB20, Argo, Corolla, Civic', preco: 'R$ 460,00', semSucata: 'R$ 500,00', minimo: '1', garantia: '12 m' },
      { modelo: 'M40SD', marca: 'Moura', linha: 'Automotiva', aplicacoes: 'Uno, Celta, Ka, Gol 1.0', preco: 'R$ 380,00', semSucata: 'R$ 410,00', minimo: '1', garantia: '12 m' },
      { modelo: 'M60AX', marca: 'Moura', linha: 'EFB', aplicacoes: 'Polo, Nivus, T-Cross TSI, Renegade', preco: 'R$ 690,00', semSucata: 'R$ 740,00', minimo: '1', garantia: '12 m' },
      { modelo: 'MA5-D', marca: 'Moura', linha: 'Moto', aplicacoes: 'Honda CG, Biz', preco: 'R$ 190,00', semSucata: 'R$ 210,00', minimo: '2', garantia: '12 m' },
      { modelo: 'HF60DD', marca: 'Heliar', linha: 'Automotiva', aplicacoes: 'Onix, HB20, Argo', preco: 'R$ 440,00', semSucata: 'R$ 480,00', minimo: '1', garantia: '12 m' },
      { modelo: 'ZTX60HD', marca: 'Zetta', linha: 'Automotiva', aplicacoes: 'Onix, HB20, Gol', preco: 'R$ 360,00', semSucata: 'R$ 390,00', minimo: '1', garantia: '12 m' }
    ];
    const atual = this.state.marca;
    return {
      aberta: this.state.aberta,
      abrir: () => this.setState({ aberta: true }),
      fechar: () => this.setState({ aberta: false }),
      menu: menuItens.map(([nome, href]) => {
        const on = nome === 'Produtos';
        return { nome, href, atual: on ? 'page' : 'false', cor: on ? '#12161C' : '#C9CED6', fundo: on ? '#FFC21A' : 'transparent', peso: on ? 700 : 500 };
      }),
      marcas: ['Todas', 'Moura', 'Heliar', 'Zetta'].map((nome) => {
        const on = nome === atual;
        return { nome, ativo: on ? 'true' : 'false', borda: on ? '2px solid #12161C' : '1px solid #C9CED6', fundo: on ? '#12161C' : '#FFFFFF', cor: on ? '#FFFFFF' : '#12161C', pick: () => this.setState({ marca: nome }) };
      }),
      produtos: todos
        .filter((p) => atual === 'Todas' || p.marca === atual)
        .map((p) => ({
          ...p,
          rotuloPreco: 'Preço de venda de ' + p.modelo,
          rotuloSem: 'Preço sem a usada de ' + p.modelo,
          rotuloAtivo: p.modelo + ' ativo'
        }))
    };
  }
}
</script>
</body>
</html>
