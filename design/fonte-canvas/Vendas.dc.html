<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Histórico de vendas · celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E40AF}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #12161C; display: flex; flex-direction: column">

  <header style="padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Voltar ao início" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #12161C">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      </a>
      <div style="flex: 1">
        <h1 style="margin: 0; font-family: Barlow, sans-serif; font-weight: 700; font-size: 26px">Vendas</h1>
        <div style="font-size: 12px; color: #5B6472">Outubro · 43 vendas · R$ 18.870</div>
      </div>
    </div>
    <div role="group" aria-label="Filtrar vendas" style="display: flex; gap: 8px; padding: 0 4px; overflow-x: auto">
      <sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
        <button aria-pressed="{{f.ativo}}" onClick="{{f.pick}}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: {{f.borda}}; background: {{f.fundo}}; color: {{f.cor}}; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{f.nome}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; padding: 4px 16px 16px">
    <section aria-label="Lista de vendas" style="background: #FFFFFF; border: 1px solid #E1E4E9; border-radius: 16px; overflow: hidden">
      <sc-for list="{{vendas}}" as="v" hint-placeholder-count="7">
        <a href="VendaDetalhe.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EEF0F3; color: #12161C; text-decoration: none; min-height: 64px; box-sizing: border-box">
          <div style="flex: 1; min-width: 0">
            <div style="font-weight: 600; font-size: 15px; text-decoration: {{v.risco}}">Nº {{v.numero}} · {{v.itens}}</div>
            <div style="font-size: 13px; color: #5B6472; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.detalhe}}</div>
          </div>
          <div style="text-align: right; flex-shrink: 0">
            <div style="font-weight: 600; font-size: 15px; text-decoration: {{v.risco}}">{{v.total}}</div>
            <span style="display: inline-block; margin-top: 2px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: {{v.notaFundo}}; color: {{v.notaCor}}">{{v.nota}}</span>
          </div>
        </a>
      </sc-for>
      <sc-if value="{{vazio}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 24px 16px; text-align: center; font-size: 15px; color: #5B6472">Nenhuma venda neste filtro.</div>
      </sc-if>
    </section>
  </main>

  <nav aria-label="Navegação principal" style="display: flex; background: #FFFFFF; border-top: 1px solid #E1E4E9; padding: 6px 4px 14px">
    <a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6472; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Início</a>
    <a href="Vender.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6472; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"></path></svg></span>Vender</a>
    <a href="Estoque.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6472; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="m3 8 9 5 9-5M12 13v8"></path></svg></span>Estoque</a>
    <a href="Entrada.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6472; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4"></path><path d="M4 16v4h16v-4"></path></svg></span>Entrada</a>
    <a href="Painel.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6472; font-size: 12px; font-weight: 500">
      <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"></path></svg></span>Painel</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filtro: 'Todas' };
  }
  renderVals() {
    const N = {
      emitida:  ['', '#E3F4EA', '#1F7A4D'],
      pendente: ['Sem nota', '#FFF4D6', '#7A4E00'],
      cancelar: ['Cancelar nota', '#FDE7E5', '#B42318'],
      na:       ['—', 'transparent', '#5B6472']
    };
    const todas = [
      { numero: '130', itens: '1× M60GD', detalhe: '27/10 14:50 · Pix · Maria Souza', total: 'R$ 450,00', s: 'pendente', ok: true },
      { numero: '129', itens: '1× M60GD', detalhe: '27/10 14:32 · Pix + Dinheiro · João da Silva', total: 'R$ 405,00', s: 'emitida', nf: 'NFC-e 129', ok: true },
      { numero: '128', itens: '1× M150BD', detalhe: '27/10 11:10 · Crédito 3x · Socorro', total: 'R$ 1.100,00', s: 'emitida', nf: 'NF-e 43', ok: true },
      { numero: '127', itens: '2× M40SD', detalhe: '27/10 09:05 · Pix · Balcão', total: 'R$ 760,00', s: 'pendente', ok: true },
      { numero: '126', itens: '1× M60GD', detalhe: '26/10 17:48 · Débito · cancelada', total: 'R$ 450,00', s: 'cancelar', ok: false },
      { numero: '125', itens: '1× M70LD', detalhe: '26/10 15:20 · Crédito 2x · Carlos Lima', total: 'R$ 600,00', s: 'emitida', nf: 'NFC-e 126', ok: true },
      { numero: '124', itens: '1× MA5-D', detalhe: '26/10 10:02 · Dinheiro · Balcão', total: 'R$ 190,00', s: 'emitida', nf: 'NFC-e 125', ok: true }
    ];
    const f = this.state.filtro;
    const visiveis = todas.filter((v) =>
      f === 'Todas' || (f === 'Sem nota' && v.s === 'pendente') || (f === 'Cancelar nota' && v.s === 'cancelar') || (f === 'Com nota' && v.s === 'emitida'));
    const qtdSem = todas.filter((v) => v.s === 'pendente').length;
    return {
      vazio: visiveis.length === 0,
      vendas: visiveis.map((v) => ({
        ...v,
        nota: v.s === 'emitida' ? v.nf : N[v.s][0],
        notaFundo: N[v.s][1],
        notaCor: N[v.s][2],
        risco: v.ok ? 'none' : 'line-through'
      })),
      filtros: ['Todas', 'Sem nota', 'Com nota', 'Cancelar nota'].map((nome) => {
        const on = nome === f;
        const rotulo = nome === 'Sem nota' ? 'Sem nota (' + qtdSem + ')' : nome;
        return { nome: rotulo, ativo: on ? 'true' : 'false', borda: on ? '2px solid #12161C' : '1px solid #C9CED6', fundo: on ? '#12161C' : '#FFFFFF', cor: on ? '#FFFFFF' : '#12161C', pick: () => this.setState({ filtro: nome }) };
      })
    };
  }
}
</script>
</body>
</html>
