<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova bateria · janela rápida</title>
<!-- Referência visual estática gerada do protótipo. Dados são de exemplo. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 100%; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #12161C; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div>
      <h2 style="margin: 0; font-family: Barlow, sans-serif; font-weight: 700; font-size: 24px">Nova bateria</h2>
      <div style="font-size: 13px; color: #5B6472">Cadastro rápido para vender agora</div>
    </div>
    <button aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1E4E9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12161C" style="stroke-width: 2.2; stroke-linecap: round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
  </div>

  <div>
    <div style="font-size: 14px; font-weight: 600; margin-bottom: 6px">Marca</div>
    <div role="group" aria-label="Marca" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      
        <button aria-pressed="false" style="height: 44px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; color: #12161C; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Moura</button>
      
        <button aria-pressed="true" style="height: 44px; border-radius: 10px; border: 2px solid #12161C; background: #12161C; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Heliar</button>
      
        <button aria-pressed="false" style="height: 44px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; color: #12161C; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Zetta</button>
      
        <button aria-pressed="false" style="height: 44px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; color: #12161C; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Outra</button>
      
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pr-modelo" style="font-size: 14px; font-weight: 600">Modelo *</label>
      <input id="pr-modelo" value="HF60DD" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 2px solid #12161C; padding: 0 12px; font-size: 16px; font-family: Inter, sans-serif; color: #12161C; width: 100%; text-transform: uppercase">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pr-linha" style="font-size: 14px; font-weight: 600">Linha *</label>
      <select id="pr-linha" style="height: 50px; border-radius: 12px; border: 1px solid #C9CED6; padding: 0 10px; font-size: 15px; font-family: Inter, sans-serif; background: #FFFFFF; color: #12161C; width: 100%"><option>Automotiva</option><option>EFB</option><option>AGM</option><option>Moto</option><option>Diesel</option></select>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="pr-apl" style="font-size: 14px; font-weight: 600">Carros que atende</label>
    <input id="pr-apl" value="Onix, HB20, Argo" placeholder="Separe por vírgula" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid #C9CED6; padding: 0 14px; font-size: 16px; font-family: Inter, sans-serif; color: #12161C">
    <span style="font-size: 12px; color: #5B6472">É o que faz a bateria aparecer quando você busca pelo carro.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pr-preco" style="font-size: 14px; font-weight: 600">Preço de venda *</label>
      <input id="pr-preco" inputmode="decimal" value="R$ 440,00" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid #C9CED6; padding: 0 12px; font-size: 16px; font-weight: 600; font-family: Inter, sans-serif; color: #12161C; width: 100%">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pr-sem" style="font-size: 14px; font-weight: 600">Sem a usada</label>
      <input id="pr-sem" inputmode="decimal" value="R$ 480,00" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid #C9CED6; padding: 0 12px; font-size: 16px; font-family: Inter, sans-serif; color: #12161C; width: 100%">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pr-min" style="font-size: 14px; font-weight: 600">Estoque mínimo</label>
      <input id="pr-min" inputmode="numeric" value="1" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid #C9CED6; padding: 0 12px; font-size: 16px; font-family: Inter, sans-serif; color: #12161C; width: 100%">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pr-gar" style="font-size: 14px; font-weight: 600">Garantia (meses)</label>
      <input id="pr-gar" inputmode="numeric" value="12" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid #C9CED6; padding: 0 12px; font-size: 16px; font-family: Inter, sans-serif; color: #12161C; width: 100%">
    </div>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #F5F6F8; font-size: 13px; color: #3D4652">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; flex-shrink: 0; margin-top: 1px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
    O estoque e o custo entram pela tela Entrada. Se vender antes disso, o estoque fica negativo até lançar a compra.
  </div>

  <button style="min-height: 56px; border-radius: 14px; border: none; background: #FFC21A; color: #12161C; font-family: Inter, sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">Salvar e adicionar à venda</button>
</div>
</body>
</html>
