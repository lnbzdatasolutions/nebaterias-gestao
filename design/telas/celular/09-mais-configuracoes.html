<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mais · configurações</title>
<!-- Referência visual estática gerada do protótipo. Dados são de exemplo. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E40AF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #12161C; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a href="02-inicio.html" aria-label="Voltar ao início" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #12161C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Barlow, sans-serif; font-weight: 700; font-size: 26px">Mais</h1>
  </header>

  <main style="flex: 1; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px">

    <section aria-label="Cadastros" style="background: #FFFFFF; border: 1px solid #E1E4E9; border-radius: 16px; overflow: hidden">
      <a href="10-clientes.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; color: #12161C; text-decoration: none; border-bottom: 1px solid #EEF0F3">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-1.5-5-4-5.6"></path></svg>
        <span style="flex: 1; font-size: 16px; font-weight: 600">Clientes</span>
        <span style="font-size: 14px; color: #5B6472">86</span>
      </a>
      <a href="11-produtos.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; color: #12161C; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><rect x="2" y="7" width="20" height="13" rx="2"></rect><path d="M6 7V4h3v3M15 7V4h3v3"></path></svg>
        <span style="flex: 1; font-size: 16px; font-weight: 600">Produtos e preços</span>
        <span style="font-size: 14px; color: #5B6472">19</span>
      </a>
    </section>

    <section aria-label="Alterar senha" style="background: #FFFFFF; border: 1px solid #E1E4E9; border-radius: 16px; overflow: hidden">
      <button aria-expanded="false" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: none; background: #FFFFFF; color: #12161C; font-family: Inter, sans-serif; text-align: left; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span style="flex: 1; font-size: 16px; font-weight: 600">Alterar senha</span>
        <span style="font-size: 20px; color: #5B6472">+</span>
      </button>
      
    </section>

    <section aria-label="Exportar dados" style="background: #FFFFFF; border: 1px solid #E1E4E9; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M4 19h16"></path></svg>
        <h2 style="margin: 0; font-size: 16px; font-weight: 600">Exportar dados (planilha)</h2>
      </div>
      <label for="per" style="font-size: 13px; font-weight: 600">Período</label>
      <select id="per" style="height: 48px; border-radius: 12px; border: 1px solid #C9CED6; padding: 0 10px; font-size: 16px; font-family: Inter, sans-serif; background: #FFFFFF"><option>Outubro de 2026</option><option>Este ano</option><option>Tudo</option></select>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="min-height: 48px; border-radius: 12px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Vendas</button>
        <button style="min-height: 48px; border-radius: 12px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Compras</button>
        <button style="min-height: 48px; border-radius: 12px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Estoque</button>
        <button style="min-height: 48px; border-radius: 12px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Clientes</button>
      </div>
    </section>

    <a href="01-login.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; border: 1px solid #F1B5AF; background: #FFFFFF; color: #B42318; text-decoration: none; font-size: 16px; font-weight: 600">Sair deste aparelho</a>
    <p style="margin: 0; text-align: center; font-size: 12px; color: #5B6472">N E Baterias · dono@nebaterias.com.br</p>
  </main>
</div>
</body>
</html>
