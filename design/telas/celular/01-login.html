<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · N E Baterias</title>
<!-- Referência visual estática gerada do protótipo. Dados são de exemplo. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E40AF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #12161C; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 40px">
    <div style="width: 76px; height: 76px; border-radius: 20px; background: #FFC21A; display: flex; align-items: center; justify-content: center">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#12161C" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><rect x="2" y="7" width="20" height="13" rx="2"></rect><path d="M6 7V4h3v3M15 7V4h3v3M6 13.5h4M14 13.5h4M16 11.5v4"></path></svg>
    </div>
    <div style="text-align: center">
      <h1 style="margin: 0; font-family: Barlow, sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1">N E Baterias</h1>
      <p style="margin: 6px 0 0; font-size: 15px; color: #5B6472">Vendas, estoque e resultados da loja</p>
    </div>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 14px; font-weight: 600">E-mail</label>
      <input id="email" type="email" inputmode="email" autocomplete="username" value="dono@nebaterias.com.br" style="height: 52px; border-radius: 12px; border: 1px solid #C9CED6; background: #FFFFFF; padding: 0 14px; font-size: 16px; font-family: Inter, sans-serif; color: #12161C">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="senha" style="font-size: 14px; font-weight: 600">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" value="12345678" style="height: 52px; border-radius: 12px; border: 1px solid #C9CED6; background: #FFFFFF; padding: 0 14px; font-size: 16px; font-family: Inter, sans-serif; color: #12161C">
    </div>
    <a href="02-inicio.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; margin-top: 8px; border-radius: 14px; background: #12161C; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px">Entrar</a>
    <a href="01-login.html" style="align-self: center; font-size: 14px; padding: 10px">Esqueci a senha</a>
  </form>

  <p style="margin: 40px 0 0; text-align: center; font-size: 13px; color: #5B6472">Você continua conectado neste aparelho.</p>
</div>
</body>
</html>
